# Publish Nexus on your own domain, with HTTPS (Caddy gets the certificate) and PostgreSQL.
#
# 1. Point your domain's DNS at this server (ports 80 and 443 open).
# 2. Next to this file, create .env with:
#      NEXUS_DOMAIN=nexus.example.com
#      NEXUS_SECRET_KEY=<python -c "import secrets; print(secrets.token_urlsafe(32))">   keep a copy: it decrypts stored keys
#      POSTGRES_PASSWORD=<another long random string>
#    Optional: NEXUS_SIGNUPS=closed (anyone can sign up otherwise), email (NEXUS_SMTP_HOST, NEXUS_SMTP_PORT, NEXUS_SMTP_USER, NEXUS_SMTP_PASSWORD,
#    NEXUS_MAIL_FROM, or NEXUS_RESEND_API_KEY) and Google sign-in (NEXUS_GOOGLE_CLIENT_ID, NEXUS_GOOGLE_CLIENT_SECRET).
# 3. docker compose up -d --build, open https://<your domain> and create the first account: it owns this Nexus.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data  # back up with: docker compose exec db pg_dump -U nexus nexus
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nexus"]
      interval: 5s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  nexus:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD}@db:5432/nexus
      NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY:?Set NEXUS_SECRET_KEY in .env}
      NEXUS_ALLOWED_HOSTS: ${NEXUS_DOMAIN:?Set NEXUS_DOMAIN in .env}
      NEXUS_PUBLIC_URL: https://${NEXUS_DOMAIN}
      NEXUS_APP_URL: https://${NEXUS_DOMAIN}
      CORS_ORIGINS: https://${NEXUS_DOMAIN}
      NEXUS_SECURE_COOKIES: "true"
      # Visitors' addresses (sign-in limits, rate limits) come from Caddy's X-Forwarded-For, and only Caddy's.
      FORWARDED_ALLOW_IPS: 172.30.0.10
      NEXUS_SIGNUPS: ${NEXUS_SIGNUPS:-}
      NEXUS_SMTP_HOST: ${NEXUS_SMTP_HOST:-}
      NEXUS_SMTP_PORT: ${NEXUS_SMTP_PORT:-}
      NEXUS_SMTP_USER: ${NEXUS_SMTP_USER:-}
      NEXUS_SMTP_PASSWORD: ${NEXUS_SMTP_PASSWORD:-}
      NEXUS_MAIL_FROM: ${NEXUS_MAIL_FROM:-}
      NEXUS_RESEND_API_KEY: ${NEXUS_RESEND_API_KEY:-}
      NEXUS_GOOGLE_CLIENT_ID: ${NEXUS_GOOGLE_CLIENT_ID:-}
      NEXUS_GOOGLE_CLIENT_SECRET: ${NEXUS_GOOGLE_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - nexus-data:/app/backend/data  # files people create and upload, MCP server logs
    mem_limit: 2g  # a crafted upload or feed that expands in a shared worker OOMs this container, not the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks: [internal]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${NEXUS_DOMAIN} --to nexus:8000
    depends_on:
      nexus:
        condition: service_healthy  # no visitor sees an error page while Nexus is still starting
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data  # certificates
    networks:
      internal:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    depends_on:
      nexus:
        condition: service_healthy  # Nexus has created the schema: the first dump isn't an empty database
    environment:
      PGHOST: db
      PGUSER: nexus
      PGDATABASE: nexus
      PGPASSWORD: ${POSTGRES_PASSWORD}
    # A dump now and then every day, the last 14 kept in the backups volume. Copy them off this server
    # (docker compose cp backup:/backups ./backups), and keep
    # NEXUS_SECRET_KEY with them: stored keys can't be read without it. Restore: pg_restore -d nexus --clean <file>
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/nexus-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$f"; then find /backups -name 'nexus-*.dump' -mtime +13 -delete; else rm -f "$$f"; fi
          sleep 86400
        done
    volumes:
      - backups:/backups  # a named volume: Podman won't create a missing host folder for a bind mount
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  nexus-data:
  caddy-data:
  backups:
